- name: Set up Talos cluster services
  hosts: localhost
  connection: local
  gather_facts: false
  # Usage:
  #   ansible-playbook playbooks/talos-setup.yml
  #
  # Prerequisites:
  #   - Cluster provisioned and bootstrapped via tofu (tofu/talos/)
  #   - talosconfig and kubeconfig extracted from tofu outputs
  #
  # Idempotent — safe to re-run at any point.

  vars:
    talos_dir: "{{ lookup('env', 'HOME') }}/repos/homelab/talos"
    k8s_dir: "{{ lookup('env', 'HOME') }}/repos/homelab/k8s"
    talosconfig: "{{ talos_dir }}/talosconfig"
    longhorn_disk_config: "{{ talos_dir }}/longhorn-user-disk.yaml"

    nodes:
      - name: cp-1
        ip: 10.0.30.11
        role: controlplane
      - name: cp-2
        ip: 10.0.30.12
        role: controlplane
      - name: cp-3
        ip: 10.0.30.13
        role: controlplane
      - name: w-1
        ip: 10.0.30.21
        role: worker
      - name: w-2
        ip: 10.0.30.22
        role: worker

  tasks:
    # --- Verify extensions ---

    - name: Verify extensions on all nodes
      ansible.builtin.command: >
        talosctl --talosconfig {{ talosconfig }}
        --nodes {{ item.ip }}
        get extensions
      loop: "{{ nodes }}"
      loop_control:
        label: "{{ item.name }}"
      register: extensions
      changed_when: false

    - name: Show extensions
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines }}"
      loop: "{{ extensions.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    # --- Longhorn ---

    - name: Apply Longhorn disk config to workers
      ansible.builtin.command: >
        talosctl --talosconfig {{ talosconfig }}
        --nodes {{ item.ip }}
        patch mc --patch @{{ longhorn_disk_config }}
      loop: "{{ nodes | selectattr('role', 'eq', 'worker') | list }}"
      loop_control:
        label: "{{ item.name }}"
      register: longhorn_patch
      failed_when: longhorn_patch.rc != 0 and 'already exists' not in longhorn_patch.stderr
      changed_when: longhorn_patch.rc == 0

    - name: Create longhorn-system namespace
      ansible.builtin.command: kubectl create namespace longhorn-system
      register: ns_result
      failed_when: ns_result.rc != 0 and 'already exists' not in ns_result.stderr
      changed_when: ns_result.rc == 0

    - name: Label longhorn-system namespace for privileged pods
      ansible.builtin.command: >
        kubectl label namespace longhorn-system
        pod-security.kubernetes.io/enforce=privileged
        --overwrite

    - name: Add Longhorn Helm repo
      ansible.builtin.command: helm repo add longhorn https://charts.longhorn.io
      register: helm_repo
      failed_when: helm_repo.rc != 0 and 'already exists' not in helm_repo.stderr
      changed_when: helm_repo.rc == 0

    - name: Update Helm repos
      ansible.builtin.command: helm repo update

    - name: Install Longhorn
      ansible.builtin.command: >
        helm upgrade --install longhorn longhorn/longhorn
        --namespace longhorn-system
        --set defaultSettings.defaultDataPath=/var/mnt/longhorn
        --wait
      register: longhorn_install
      retries: 3
      delay: 30
      until: longhorn_install.rc == 0

    # --- ArgoCD ---

    - name: Create argocd namespace
      ansible.builtin.command: kubectl create namespace argocd
      register: argocd_ns
      failed_when: argocd_ns.rc != 0 and 'already exists' not in argocd_ns.stderr
      changed_when: argocd_ns.rc == 0

    - name: Install ArgoCD
      ansible.builtin.command: >
        kubectl apply -n argocd --server-side --force-conflicts
        -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.2.0/manifests/install.yaml

    - name: Configure ArgoCD insecure mode
      ansible.builtin.command: >
        kubectl -n argocd patch configmap argocd-cmd-params-cm
        --type merge -p '{"data": {"server.insecure": "true"}}'

    - name: Expose ArgoCD via NodePort
      ansible.builtin.command: >
        kubectl patch svc argocd-server -n argocd
        -p '{"spec": {"type": "NodePort", "ports": [{"port": 443, "targetPort": 8080, "nodePort": 30443, "protocol": "TCP", "name": "https"}]}}'

    - name: Restart ArgoCD server
      ansible.builtin.command: kubectl -n argocd rollout restart deployment argocd-server

    - name: Wait for ArgoCD to be ready
      ansible.builtin.command: kubectl -n argocd rollout status deployment argocd-server --timeout=120s
      retries: 3
      delay: 10
      register: argocd_ready
      until: argocd_ready.rc == 0

    # --- Root app (ArgoCD manages everything from here) ---

    - name: Apply root ArgoCD application
      ansible.builtin.command: kubectl apply -f {{ k8s_dir }}/argocd/root-app.yaml

    - name: Show ArgoCD admin password
      ansible.builtin.shell: >
        kubectl -n argocd get secret argocd-initial-admin-secret
        -o jsonpath='{.data.password}' | base64 -d
      register: argocd_password
      changed_when: false

    - name: Setup complete
      ansible.builtin.debug:
        msg:
          - "Cluster services installed"
          - "ArgoCD UI: http://argocd.lab.taylor-meador.com"
          - "ArgoCD admin password: {{ argocd_password.stdout }}"
          - "ArgoCD root app will sync all applications from k8s/argocd/"
