apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dexter
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/taylormeador/homelab
    targetRevision: main
    path: k8s/dexter
  destination:
    server: https://kubernetes.default.svc
    namespace: dexter
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
