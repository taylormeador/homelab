apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: playit-agent
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/taylormeador/homelab
    targetRevision: main
    path: k8s/playit
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
