apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: "1.13.1"
    helm:
      valuesObject:
        alloy:
          configMap:
            content: |
              // Node metrics (CPU, memory, disk, network)
              prometheus.exporter.unix "node" {}

              prometheus.scrape "node" {
                targets    = prometheus.exporter.unix.node.targets
                forward_to = [prometheus.remote_write.default.receiver]
              }

              // Pod discovery for log collection
              discovery.kubernetes "pods" {
                role = "pod"
              }

              discovery.relabel "pods" {
                targets = discovery.kubernetes.pods.targets

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
              }

              loki.source.kubernetes "pods" {
                targets    = discovery.relabel.pods.output
                forward_to = [loki.write.default.receiver]
              }

              // Forward metrics to in-cluster Prometheus
              prometheus.remote_write "default" {
                endpoint {
                  url = "http://prometheus-server.monitoring.svc:80/api/v1/write"
                }
              }

              // Forward logs to in-cluster Loki
              loki.write "default" {
                endpoint {
                  url = "http://loki-gateway.monitoring.svc:80/loki/api/v1/push"
                }
              }
        controller:
          type: daemonset
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=false
