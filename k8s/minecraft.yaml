apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft-0
  labels:
    app: minecraft-0
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minecraft-0
  template:
    metadata:
      labels:
        app: minecraft-0
    spec:
      containers:
        - name: minecraft
          image: itzg/minecraft-server:java25
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: "PAPER"
            - name: HARDCORE
              value: "true"
            - name: DIFFICULTY
              value: "hard"
            - name: MEMORY
              value: "2G"
            - name: MOTD
              value: "Hardcore"
            - name: VERSION
              value: "26.3"
          ports:
            - containerPort: 25565
              name: minecraft
          volumeMounts:
            - name: world-data
              mountPath: /data
          resources:
            requests:
              memory: 2Gi
              cpu: "1"
            limits:
              memory: 4Gi
              cpu: "2"
      volumes:
        - name: world-data
          persistentVolumeClaim:
            claimName: minecraft-0
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-0
  labels:
    app: minecraft-0
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: minecraft-0
  labels:
    app: minecraft-0
spec:
  type: ClusterIP
  clusterIP: 10.96.1.0
  selector:
    app: minecraft-0
  ports:
    - protocol: TCP
      port: 25565
      targetPort: 25565
