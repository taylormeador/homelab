syntax = "proto3";

package platform.v1;

option go_package = "github.com/taylormeador/homelab/dexter/internal/gen/platform/v1";

service PlatformService {
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
}
