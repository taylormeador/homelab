syntax = "proto3";

package dexter.v1;

option go_package = "github.com/taylormeador/homelab/dexter/internal/gen/dexter/v1";

service Dexter {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc CreateMinecraftWorld(CreateMinecraftWorldRequest) returns (CreateMinecraftWorldResponse);
  rpc DeleteMinecraftWorld(DeleteMinecraftWorldRequest) returns (DeleteMinecraftWorldResponse);
  rpc ListMinecraftWorlds(ListMinecraftWorldsRequest) returns (ListMinecraftWorldsResponse);
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
}

message CreateMinecraftWorldRequest {
  optional int32 index = 1;
}

message CreateMinecraftWorldResponse {
  string message = 1;
}

message DeleteMinecraftWorldRequest {
  int32 index = 1;
}

message DeleteMinecraftWorldResponse {
  string message = 1;
}

message ListMinecraftWorldsRequest {}

message ListMinecraftWorldsResponse {
  repeated string worlds = 1;
}
